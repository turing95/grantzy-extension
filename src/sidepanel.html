<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Grantzy Application Sidepanel</title>
    <script type="module" src="../dist/sidepanel.js"></script>
    <style>
.grantzy-widget {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: #fff;
  padding: 15px;
  z-index: 2000;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
}

.grantzy-widget .widget-container {
  display: grid;
  grid-template-areas:
    "header header"
    "search search"
    "sidebar main";
  grid-template-columns: 280px 1fr;
  grid-template-rows: auto auto 1fr;
  gap: 10px;
  flex: 1;
  overflow: hidden;
  padding: 0 10px 10px;
}

.grantzy-widget .widget-header {
  grid-area: header;
  font-size: 1.2em;
  font-weight: bold;
  border-bottom: 1px solid #eee;
  padding-bottom: 5px;
  margin: 0;
}

#back-button {
  position: absolute;
  top: 20px;
  right: 20px;
  background-color: #007bff;
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}

#back-button:hover {
  background-color: #0056b3;
}

#app-search-input {
  grid-area: search;
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1em;
}

.grantzy-widget .widget-sidebar {
  grid-area: sidebar;
  border-right: 1px solid #ddd;
  background-color: #fafafa;
  overflow-y: auto;
}

.grantzy-widget .widget-sidebar li.selected-root {
  background-color: #e0f7fa;
}

#main-panel {
  grid-area: main;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  gap: 10px;
}

#app-search-results {
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 8px;
  min-height: 130px;
  max-height: 240px;
  overflow-y: auto;
}

.grantzy-widget .result-item {
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 10px;
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.grantzy-widget .result-item:hover,
.grantzy-widget .result-item.hovered {
  background-color: #f0f8ff;
  border-color: #add8e6;
}

.result-key {
  display: block;
  font-weight: bold;
  font-size: 0.85em;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.result-value {
  white-space: normal;
}

#autofill-panel {
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

.autofill-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.autofill-actions button {
  background-color: #1f2937;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 0.86em;
}

.autofill-actions button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#autofill-status {
  font-size: 0.9em;
  padding: 8px;
  border-radius: 6px;
  background: #f3f4f6;
  color: #111827;
}

#autofill-status.error {
  background: #fee2e2;
  color: #7f1d1d;
}

#autofill-status.success {
  background: #dcfce7;
  color: #14532d;
}

#autofill-preview {
  overflow-y: auto;
  max-height: 280px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  padding: 8px;
}

.preview-row {
  border: 1px solid #f0f0f0;
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 8px;
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 8px;
  row-gap: 4px;
  align-items: start;
}

.preview-main {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.preview-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.preview-badge {
  font-size: 0.72em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 2px 8px;
  border: 1px solid transparent;
}

.preview-badge.auto,
.preview-badge.manual {
  background: #dcfce7;
  color: #14532d;
  border-color: #86efac;
}

.preview-badge.needs_review {
  background: #fef9c3;
  color: #713f12;
  border-color: #fcd34d;
}

.preview-badge.skipped {
  background: #fee2e2;
  color: #7f1d1d;
  border-color: #fca5a5;
}

.preview-controls {
  display: flex;
  gap: 6px;
  align-items: center;
}

.preview-controls select {
  flex: 1;
  min-width: 0;
  padding: 4px 6px;
}

#autofill-report {
  font-size: 0.85em;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  padding: 8px;
  max-height: 150px;
  overflow-y: auto;
}

.grantzy-widget .widget-container.no-sidebar {
  grid-template-areas:
    "header header"
    "search search"
    "main main";
  grid-template-columns: 1fr;
}
    </style>
</head>
<body>
<div id="grantzy-sidepanel" class="grantzy-widget">
    <div class="widget-container">
        <div class="widget-header">Grantzy Applications</div>
        <button id="back-button">← Back</button>
        <input type="text" id="app-search-input" placeholder="Search applications..."/>

        <div id="main-panel">
            <div id="app-search-results" class="results-container"></div>

            <section id="autofill-panel">
                <div class="autofill-actions">
                    <button id="analyze-form-btn" type="button">Analyze Current Form</button>
                    <button id="preview-fill-btn" type="button">Preview Fill</button>
                    <button id="apply-fill-btn" type="button">Apply Fill</button>
                    <button id="undo-fill-btn" type="button">Undo Last Fill</button>
                </div>
                <div id="autofill-status">Select an application and click Analyze Current Form.</div>
                <div id="autofill-preview"></div>
                <div id="autofill-report"></div>
            </section>
        </div>
    </div>
</div>
</body>
</html>
